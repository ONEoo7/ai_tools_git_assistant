name: release

# Cutting a release is `git push origin v0.1.0` and nothing else. Everything
# below runs on a clean runner so the artifact is not "whatever was on a laptop".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the asset
  id-token: write # OIDC token, used to obtain a Sigstore signing certificate
  attestations: write # store the SLSA provenance against the artifact digest

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Third-party actions are pinned by commit SHA, not by tag. A tag is
      # mutable: whoever controls the repository can repoint v9.0.0 at new code
      # and it lands in this build silently.
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      # A tag that disagrees with pyproject.toml would publish under a version
      # the application does not report at runtime, and the updater compares
      # exactly those two numbers to decide whether an update exists. Get it
      # wrong low and the build offers itself as an update forever; wrong high
      # and a real update is never offered.
      #
      # Checked against `__init__.py`, not `pyproject.toml`: pyproject now
      # derives its version from that literal, and the literal is what a frozen
      # build reports, since PyInstaller ships no distribution metadata.
      - name: Resolve the version and check it against the source
        id: v
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $source = "src/git_assistant/__init__.py"
          $line = Select-String -Path $source -Pattern '^__version__ = "(.+)"' | Select-Object -First 1
          if (-not $line) { throw "no __version__ found in $source" }
          $declared = $line.Matches[0].Groups[1].Value
          if ($version -ne $declared) {
            throw "tag $tag implies version $version, but $source declares $declared"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # --locked fails if uv.lock has drifted from pyproject.toml, rather than
      # quietly resolving something different from what was tested.
      - name: Install dependencies
        run: uv sync --locked --extra build

      # --onedir, not --onefile: a onefile build unpacks to %TEMP% on every
      # launch, which defeats both A/B slot installs and Authenticode pinning of
      # the files actually executed.
      #
      # --add-data is separate from --icon and both are needed: --icon sets the
      # executable's shell icon, while the tray loads icon.ico at runtime.
      #
      # Built from the spec, not a command line. A command line can only
      # produce one executable, and this build needs two: the tray application
      # and the console MCP server a client starts over stdio. It was also a
      # place that had to agree with the specs about what ships, and did not.
      #
      # ONE bundle now. There used to be a second with the self-updater left
      # out, because a build that downloads and runs an installer is what
      # endpoint protection reacts to. Updating goes through winget, so there
      # is no such code to leave out. See git_assistant.updating.
      - name: Build
        run: uv run pyinstaller --noconfirm git-assistant-onedir.spec

      # The portable zip: the same bundle as the installers, unzipped anywhere.
      #
      # An unzipped copy still reports `sys.frozen`, so it passes the "is this
      # installed" check -- but `winget upgrade` on a folder winget never
      # installed does nothing, and `winget install` would put a *second*,
      # installed copy under %LOCALAPPDATA% while the folder actually being run
      # sat unchanged and stale. So portable means portable: unzip it, run it,
      # replace the folder to upgrade. Nothing writes outside it except the
      # settings every variant keeps in %LOCALAPPDATA%\git-assistant.
      #
      # The `-noupdate` suffix this file used to carry is gone with the build
      # variant it named.
      - name: Package
        id: pkg
        run: |
          $name = "git-assistant-${{ steps.v.outputs.version }}-windows-x64.zip"
          uv run python -m zipfile -c $name dist/GitAssistant/
          $sha = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "$sha  $name"

      # NSIS is not guaranteed on the runner image, and the Chocolatey community
      # feed answers 504 often enough to have already broken a release here. So:
      # look in every plausible place first, and retry the install rather than
      # failing the build on one bad response.
      - name: Ensure NSIS is available
        run: |
          function Find-MakeNsis {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            foreach ($p in @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe",
              "$env:ChocolateyInstall\bin\makensis.exe"
            )) { if (Test-Path $p) { return $p } }
            return $null
          }

          $makensis = Find-MakeNsis
          if ($makensis) {
            Write-Host "Found NSIS on the image: $makensis"
          } else {
            foreach ($attempt in 1..2) {
              Write-Host "NSIS not present; choco attempt $attempt of 2."
              choco install nsis -y --no-progress --no-color
              $makensis = Find-MakeNsis
              if ($makensis) { break }
              if ($attempt -lt 2) { Start-Sleep -Seconds 15 }
            }
          }

          # Chocolatey's community feed is a single point of failure and has
          # already 504'd a release here. Fall back to NSIS's own zip, which
          # needs no installer and no admin: makensis runs from the extracted
          # folder. Pinned by digest in .github/nsis.lock when that file exists,
          # following the same rule as the update verifier -- makensis compiles
          # the artifact users run, so what it is matters.
          if (-not $makensis) {
            $lock = ".github/nsis.lock"
            $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10.zip"
            $sha256 = ""
            if (Test-Path $lock) {
              foreach ($line in Get-Content $lock) {
                if ($line -match '^\s*([a-z0-9]+)\s*=\s*(\S+)\s*$') {
                  if ($Matches[1] -eq "url")    { $url = $Matches[2] }
                  if ($Matches[1] -eq "sha256") { $sha256 = $Matches[2] }
                }
              }
            }

            # SourceForge answers some requests with an HTML interstitial that
            # Invoke-WebRequest saves happily. Without this check the build
            # would "download NSIS", then fail deep in Expand-Archive - or
            # worse, pin the digest of a web page.
            function Test-IsZip($path) {
              if (-not (Test-Path $path)) { return $false }
              try {
                $fs = [System.IO.File]::OpenRead($path)
                try {
                  $sig = New-Object byte[] 2
                  $null = $fs.Read($sig, 0, 2)
                  return ($sig[0] -eq 0x50 -and $sig[1] -eq 0x4B)  # "PK"
                } finally { $fs.Dispose() }
              } catch {
                return $false  # unreadable or partial download is not a zip
              }
            }

            $zip = "nsis-dist.zip"
            foreach ($attempt in 1..3) {
              try {
                Write-Host "Downloading NSIS ($attempt of 3): $url"
                Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRedirection 10
                if (Test-IsZip $zip) { break }
                Write-Host "  response was not a zip (interstitial or error page); discarding."
                Remove-Item $zip -Force -ErrorAction SilentlyContinue
              } catch {
                Write-Host "  failed: $($_.Exception.Message)"
              }
              if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
            }

            if (Test-IsZip $zip) {
              $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
              if ($sha256) {
                if ($actual -ne $sha256.ToLower()) {
                  throw "NSIS zip digest mismatch`nexpected $sha256`ngot      $actual"
                }
                Write-Host "NSIS digest matches the pin in $lock."
              } else {
                $msg = ("NSIS was fetched UNPINNED (no $lock). SHA-256 ``$actual``. " +
                        "Add that digest to $lock to pin the tool that builds the installer.")
                Write-Warning $msg
                "### NSIS: unpinned`n`n$msg" >> $env:GITHUB_STEP_SUMMARY
              }
              Expand-Archive -Path $zip -DestinationPath "nsis-dist" -Force
              $makensis = (Get-ChildItem "nsis-dist" -Recurse -Filter "makensis.exe" |
                           Select-Object -First 1).FullName
            }
          }

          if (-not $makensis) {
            throw ("makensis could not be obtained. Searched PATH, both " +
                   "Program Files\NSIS locations and the Chocolatey bin, then " +
                   "tried choco (2x) and the NSIS zip (3x). Both sources may be " +
                   "down; re-run this job.")
          }
          & $makensis /VERSION
          "NSIS_EXE=$makensis" >> $env:GITHUB_ENV
          # choco leaves a non-zero exit code behind even when a later attempt
          # succeeded, and pwsh steps fail on the trailing $LASTEXITCODE.
          exit 0

      # Wraps the self-updating onedir tree from the Build step. The portable
      # zip is NOT this build -- it is cut from the no-update variant, for the
      # reason given at the Package step -- so the two are no longer the same
      # binary and this must keep pointing at the updating build's directory.
      #
      # SRC_DIR/EXE_NAME are still passed explicitly even though both variants
      # now come from a spec and are named the same: the .nsi has its own
      # default, and a release should not depend on it agreeing.
      #
      # The .nsi path must be ABSOLUTE. Given a relative one, NSIS resolves
      # ${__FILEDIR__} to <cwd>\installer\installer -- the script's own
      # directory appended twice -- and the LICENSE and icon lookups fail.
      # Two installers from one bundle, differing only in where they install:
      #
      #   -user     %LOCALAPPDATA%\Programs, no UAC prompt
      #   -machine  Program Files, requires elevation
      #
      # There were four, because a second bundle existed with the self-updater
      # compiled out. Updating is winget's job now and no build contains an
      # updater to leave out, so the axis is gone along with the two filenames
      # that only ever differed by it.
      - name: Build the installers
        id: inst
        run: |
          $version = "${{ steps.v.outputs.version }}"
          $root = $PWD.Path
          $variants = @(
            @{ key = "user";    dir = "dist\GitAssistant"; exe = "GitAssistant.exe"; machine = $false },
            @{ key = "machine"; dir = "dist\GitAssistant"; exe = "GitAssistant.exe"; machine = $true  }
          )

          foreach ($v in $variants) {
            $name = "git-assistant-$version-$($v.key)-windows-x64-setup.exe"
            $defines = @(
              "/DVERSION=$version",
              "/DSRC_DIR=$root\$($v.dir)",
              "/DEXE_NAME=$($v.exe)",
              "/DOUT_FILE=$root\$name"
            )
            if ($v.machine) { $defines += "/DPERMACHINE" }

            & $env:NSIS_EXE @defines "$root\installer\git-assistant.nsi"
            if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE for $($v.key)" }
            if (-not (Test-Path $name)) { throw "installer was not produced: $name" }

            # Underscores in the output key: a hyphen is parsed as a
            # subtraction by the Actions expression language, so it would yield
            # an empty string at the point of use rather than an error anywhere
            # near this line.
            $out = $v.key -replace '-', '_'
            $sha = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
            "${out}_name=$name" >> $env:GITHUB_OUTPUT
            "${out}_sha256=$sha" >> $env:GITHUB_OUTPUT
            Write-Host "$sha  $name"
          }

      # Emits an in-toto Statement v1 carrying a SLSA Provenance v1 predicate,
      # wrapped in a DSSE envelope. Must run before the release is published so
      # the attestation exists by the time anything can download the asset.
      # Every asset is attested: a signed provenance covering some of them would
      # leave whichever download a user actually picked unvouched.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ${{ steps.pkg.outputs.name }}
            ${{ steps.inst.outputs.user_name }}
            ${{ steps.inst.outputs.machine_name }}

      # gh is preinstalled on the runner. Using it rather than a release action
      # keeps one less third-party dependency in the path that produces the
      # artifact everyone downstream trusts.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Literal here-string: backticks are escapes in a "@ ... "@ one, and
          # the values are substituted by Actions before PowerShell parses this.
          $notes = @'
          Automated build.

          | Download | Installs to | Admin | Updates | SHA-256 |
          | --- | --- | --- | --- | --- |
          | `${{ steps.inst.outputs.user_name }}` | `%LOCALAPPDATA%` | no | winget | `${{ steps.inst.outputs.user_sha256 }}` |
          | `${{ steps.inst.outputs.machine_name }}` | `Program Files` | yes | winget* | `${{ steps.inst.outputs.machine_sha256 }}` |
          | `${{ steps.pkg.outputs.name }}` (portable zip) | anywhere | no | replace the folder | `${{ steps.pkg.outputs.sha256 }}` |

          **Which download?**

          - `-user` installs for you alone and never prompts for admin.
          - `-machine` installs to `Program Files` for everyone, and asks for admin once
            at install time.
          - The **portable zip**: unzip anywhere, run `GitAssistant.exe`, replace the
            folder to upgrade.

          **Updating.** Git Assistant no longer updates itself. It asks winget every
          five minutes whether a newer `StefanGhitescu.GitAssistant` is published, and
          on your say-so runs `winget upgrade` — so what lands on disk is fetched and
          hash-checked by the Windows Package Manager, not by this application. The
          previous releases carried a TUF-verified self-updater and a second build with
          it compiled out; there is one build now, and no code in it that downloads or
          executes a release.

          \* A `-machine` install needs elevation to replace `Program Files`, so winget
          raises a UAC prompt when it runs the installer.

          Nothing here starts Git Assistant automatically at sign-in, and no installer
          launches the application when it finishes.
          '@
          gh release create "${{ github.ref_name }}" `
            "${{ steps.inst.outputs.user_name }}" `
            "${{ steps.inst.outputs.machine_name }}" `
            "${{ steps.pkg.outputs.name }}" `
            --title "${{ github.ref_name }}" `
            --notes $notes

      # ---- winget ------------------------------------------------------------
      # Everything below runs AFTER the release is published: the action reads
      # the release's assets, and an unpublished or draft release has none.
      #
      # Deliberately steps in THIS job rather than a separate workflow on
      # `release: published`. The release above is created with
      # ${{ github.token }}, and GitHub does not start new workflow runs from
      # events raised by that token -- so a `release: published` workflow would
      # never fire, and would look from the outside like winget being broken
      # rather than never invoked. That is the same failure UPDATE_URL produced
      # twice; once is enough to design around.
      #
      # The token is a *classic* PAT with the `public_repo` scope. Fine-grained
      # tokens are not supported by the action, and a fork of
      # microsoft/winget-pkgs must exist under ${{ github.repository_owner }}
      # for it to push a branch to.
      - name: Check for the winget token
        id: winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ($env:WINGET_TOKEN) {
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            $msg = ("No WINGET_TOKEN secret - this release was NOT submitted to " +
                    "winget. The release itself is unaffected. Add a classic PAT " +
                    "with the public_repo scope and fork microsoft/winget-pkgs " +
                    "under ${{ github.repository_owner }} to enable it.")
            Write-Warning $msg
            "### winget: not submitted`n`n$msg" >> $env:GITHUB_STEP_SUMMARY
          }

      # Submits the per-USER installer and NOTHING else.
      #
      # Exactly ONE installer, deliberately. Two nullsoft installers of the same
      # Architecture are duplicates to winget-pkgs validation unless each
      # declares a `Scope`, and this action generates manifests from the release
      # assets rather than inventing that field. The published manifest carries
      # the single per-user installer and no Scope, so matching both here would
      # produce the first auto-submitted version that fails validation -- on a
      # release that had already shipped.
      #
      # Per-user rather than per-machine for a second reason: this is the
      # package the application's own update check upgrades, and a per-machine
      # install raises a UAC prompt from a process the user did not start.
      #
      # To offer both scopes later: hand-edit a version's installer manifest to
      # add `Scope: user` and `Scope: machine`, get it merged, then widen this
      # regex to `(user|machine)-windows-x64-setup\.exe$` so the generated
      # manifests have a base that already distinguishes them.
      #
      # The regex matches the whole suffix rather than just "user", so the
      # portable zip and the per-machine installer are excluded by construction
      # -- not by the default regex happening not to reach them.
      #
      # Pinned by commit, like every other third-party action here, and more
      # sharply than most: `v2` is a lightweight tag pointing at `main`, so it
      # moves whenever that branch does.
      - name: Submit to winget
        id: submit
        if: steps.winget.outputs.present == 'true'
        # A winget PR that did not open is not a failed release. The artifacts
        # above are published, attested and correct; this can be re-run or done
        # by hand. Reported in the next step rather than reddening the build.
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          # Must match the merged manifest EXACTLY -- it is the primary key in
          # winget-pkgs and cannot be changed once published. A mismatch does
          # not error: it opens a PR for a second, unrelated package.
          identifier: StefanGhitescu.GitAssistant
          version: ${{ steps.v.outputs.version }}
          release-tag: ${{ github.ref_name }}
          installers-regex: '-user-windows-x64-setup\.exe$'
          release-notes-url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}

      # `outcome` is the step's real result; `conclusion` is what
      # continue-on-error rewrote it to, and would read "success" either way.
      - name: Report the winget submission
        if: always() && steps.winget.outputs.present == 'true'
        run: |
          $version = "${{ steps.v.outputs.version }}"
          if ("${{ steps.submit.outcome }}" -eq "success") {
            ("### winget: submitted`n`nPR opened against microsoft/winget-pkgs " +
             "for ``StefanGhitescu.GitAssistant`` $version.") >> $env:GITHUB_STEP_SUMMARY
          } else {
            $msg = ("The winget submission FAILED (${{ steps.submit.outcome }}). " +
                    "The release is published and correct; only the manifest PR " +
                    "is missing. Re-run this job, or submit by hand with " +
                    "``wingetcreate update StefanGhitescu.GitAssistant --version $version``.")
            Write-Warning $msg
            "### winget: submission failed`n`n$msg" >> $env:GITHUB_STEP_SUMMARY
          }
