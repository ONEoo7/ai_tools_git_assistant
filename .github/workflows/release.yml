name: release

# Cutting a release is `git push origin v0.1.0` and nothing else. Everything
# below runs on a clean runner so the artifact is not "whatever was on a laptop".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the asset
  id-token: write # OIDC token, used to obtain a Sigstore signing certificate
  attestations: write # store the SLSA provenance against the artifact digest

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Third-party actions are pinned by commit SHA, not by tag. A tag is
      # mutable: whoever controls the repository can repoint v9.0.0 at new code
      # and it lands in this build silently.
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      # A tag that disagrees with pyproject.toml would publish under a version
      # the application does not report at runtime, and the updater compares
      # exactly those two numbers to decide whether an update exists. Get it
      # wrong low and the build offers itself as an update forever; wrong high
      # and a real update is never offered.
      #
      # Checked against `__init__.py`, not `pyproject.toml`: pyproject now
      # derives its version from that literal, and the literal is what a frozen
      # build reports, since PyInstaller ships no distribution metadata.
      - name: Resolve the version and check it against the source
        id: v
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $source = "src/git_assistant/__init__.py"
          $line = Select-String -Path $source -Pattern '^__version__ = "(.+)"' | Select-Object -First 1
          if (-not $line) { throw "no __version__ found in $source" }
          $declared = $line.Matches[0].Groups[1].Value
          if ($version -ne $declared) {
            throw "tag $tag implies version $version, but $source declares $declared"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # --locked fails if uv.lock has drifted from pyproject.toml, rather than
      # quietly resolving something different from what was tested.
      - name: Install dependencies
        run: uv sync --locked --extra build

      # dist-client carries the TUF verifier and is not on an index yet, so it
      # is injected rather than resolved. Both the URL and the expected digest
      # live in .github/dist-client.lock -- in the repository, so changing what
      # verifies every future update is a commit someone reviews rather than a
      # CI setting someone can flip unseen.
      #
      # Without the file the build proceeds with no updater. That is a real
      # difference in what ships, so it goes in the job summary rather than
      # passing unnoticed.
      - name: Install the update verifier
        id: updater
        run: |
          $lock = ".github/dist-client.lock"
          if (-not (Test-Path $lock)) {
            "present=false" >> $env:GITHUB_OUTPUT
            $msg = "No $lock - this build ships WITHOUT self-update."
            Write-Warning $msg
            "### Self-update: not included`n`n$msg" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $config = @{}
          foreach ($line in Get-Content $lock) {
            if ($line -match '^\s*([a-z0-9]+)\s*=\s*(\S+)\s*$') {
              $config[$Matches[1]] = $Matches[2]
            }
          }
          foreach ($key in @("url", "sha256")) {
            if (-not $config.ContainsKey($key)) { throw "$lock has no '$key'" }
          }

          # Keep the published filename: a wheel must be named
          # <name>-<version>-<tags>.whl or pip refuses to install it, and
          # renaming it to something tidy like dist_client.whl fails with an
          # error about the version that says nothing about the rename.
          $name = Split-Path -Leaf ([uri]$config.url).AbsolutePath
          Invoke-WebRequest -Uri $config.url -OutFile $name

          $actual = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $config.sha256.ToLower()) {
            throw "verifier wheel digest mismatch`nexpected $($config.sha256)`ngot      $actual"
          }

          uv pip install $name
          "present=true" >> $env:GITHUB_OUTPUT
          "### Self-update: included`n`n``$name```n`nSHA-256 ``$actual`` (matches the pin)" >> $env:GITHUB_STEP_SUMMARY

      # The trusted root must exist before the build, or the packaged
      # application has an updater that trusts nothing.
      - name: Check the trusted root is present
        if: steps.updater.outputs.present == 'true'
        run: |
          if (-not (Test-Path "src/git_assistant/updating/root.json")) {
            throw "root.json is missing; see src/git_assistant/updating/README.md"
          }

      # An installed desktop application never sees a shell's environment: it
      # is launched from the Start Menu and inherits the *user* environment, so
      # configuring this through an environment variable reached a checkout,
      # where self-update is refused, and reached nothing else. Writing the
      # address into the build is what makes a fresh install work with no
      # configuration at all.
      #
      # Users override it in `update.json` beside their settings, so a service
      # that goes down does not strand every installation.
      #
      # The address is COMMITTED, in `update_url.txt`, so every build carries
      # one by construction. It used to come only from a repository variable,
      # and an unset variable shipped a build with no updater at all — which is
      # exactly what happened, twice, and looked from the outside like the
      # feature being broken rather than unconfigured.
      #
      # `vars.UPDATE_URL` still overrides it, for a fork or a staging pipeline
      # that publishes somewhere else. It is a variable rather than a secret:
      # it is a URL, it is readable in any packaged build, and hiding it would
      # only hide it from whoever reviews this workflow.
      #
      # Missing entirely is now a build failure. Shipping an application whose
      # updater silently does nothing is worse than not shipping.
      - name: Set the update service address
        if: steps.updater.outputs.present == 'true'
        run: |
          $file = "src/git_assistant/updating/update_url.txt"
          $override = "${{ vars.UPDATE_URL }}".Trim()

          if ($override) {
            $url = $override
            $source = "UPDATE_URL repository variable"
          } elseif (Test-Path $file) {
            $url = (Get-Content $file -Raw).Trim()
            $source = "$file (committed)"
          } else {
            throw "no update service address: $file is missing and UPDATE_URL is unset"
          }

          if ($url -notmatch '^https?://') {
            throw "the update address must start with http:// or https://, got '$url' from $source"
          }
          # The repository root, not its metadata directory. Getting this wrong
          # produces 404s on every metadata fetch and an error that talks about
          # timestamp.json rather than about the URL.
          if ($url -match '/metadata/?$') {
            throw "the update address is the repository root, not its metadata directory: '$url'"
          }

          $url | Set-Content -Path $file -NoNewline -Encoding utf8
          "### Update service`n`n``$url```n`nfrom $source" >> $env:GITHUB_STEP_SUMMARY

      # --onedir, not --onefile: a onefile build unpacks to %TEMP% on every
      # launch, which defeats both A/B slot installs and Authenticode pinning of
      # the files actually executed.
      #
      # --add-data is separate from --icon and both are needed: --icon sets the
      # executable's shell icon, while the tray loads icon.ico at runtime.
      #
      # --collect-all dist_client pulls in the verifier library that travels
      # inside that wheel. PyInstaller does not follow a ctypes load, so
      # without it the packaged application would import dist_client and then
      # fail to find the library it wraps.
      - name: Build
        run: |
          $args = @(
            "--noconfirm", "--windowed",
            "--name", "git-assistant",
            "--paths", "src",
            "--icon", "src/git_assistant/resources/icon.ico",
            "--add-data", "src/git_assistant/resources;git_assistant/resources"
          )
          if ("${{ steps.updater.outputs.present }}" -eq "true") {
            $args += @(
              "--collect-all", "dist_client",
              "--add-data", "src/git_assistant/updating/root.json;git_assistant/updating"
            )
            # Unconditional: the previous step fails the build if there is no
            # address, so by here there is always a file to bundle. Making this
            # conditional is how a build shipped without one and said nothing.
            $args += @(
              "--add-data", "src/git_assistant/updating/update_url.txt;git_assistant/updating"
            )
          }
          $args += "src/git_assistant/__main__.py"
          uv run pyinstaller @args

      # The second variant: the same application with the self-updater left out
      # of the bundle entirely. It is what both the portable zip and the
      # per-machine installer are cut from.
      #
      # Built from the spec rather than a command line like the step above,
      # because what has to be excluded (git_assistant.updating, the
      # update_prompt module, dist_client) and what must NOT be (httpx, which
      # lmstudio_client needs and which an earlier attempt dropped, producing a
      # build that died on launch) is expressed there and covered by tests.
      #
      # Its own dist directory, so neither installer can package the other's
      # build. The spec names the executable GitAssistant.exe, unlike this
      # workflow's git-assistant.exe.
      - name: Build the no-update variant
        run: uv run pyinstaller --noconfirm git-assistant-onedir-noupdate.spec

      # The portable zip is cut from the no-update build, not the one above.
      #
      # Self-update in a portable build was always wrong: `is_installed()` is
      # just `sys.frozen`, so an unzipped copy passed the check, and updating
      # means downloading and running an *installer*. A user who unpacked the
      # zip somewhere and accepted an update would get a second, installed copy
      # under %LOCALAPPDATA% while the folder they were actually running from
      # sat unchanged and stale.
      #
      # Portable therefore means portable: unzip it, run it, replace the folder
      # to upgrade. Nothing writes outside it except the settings every variant
      # keeps in %LOCALAPPDATA%\git-assistant.
      #
      # Named for what it contains. There is only one zip, so the suffix
      # disambiguates nothing today -- but a filename outlives the release notes
      # that explain it, ending up in scripts and bookmarks stripped of context,
      # and "the portable one" is not a safe thing to have to remember about a
      # build that cannot update itself.
      - name: Package
        id: pkg
        run: |
          $name = "git-assistant-${{ steps.v.outputs.version }}-noupdate-windows-x64.zip"
          uv run python -m zipfile -c $name dist/GitAssistant-noupdate/
          $sha = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "$sha  $name"

      # NSIS is not guaranteed on the runner image, and the Chocolatey community
      # feed answers 504 often enough to have already broken a release here. So:
      # look in every plausible place first, and retry the install rather than
      # failing the build on one bad response.
      - name: Ensure NSIS is available
        run: |
          function Find-MakeNsis {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            foreach ($p in @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe",
              "$env:ChocolateyInstall\bin\makensis.exe"
            )) { if (Test-Path $p) { return $p } }
            return $null
          }

          $makensis = Find-MakeNsis
          if ($makensis) {
            Write-Host "Found NSIS on the image: $makensis"
          } else {
            foreach ($attempt in 1..2) {
              Write-Host "NSIS not present; choco attempt $attempt of 2."
              choco install nsis -y --no-progress --no-color
              $makensis = Find-MakeNsis
              if ($makensis) { break }
              if ($attempt -lt 2) { Start-Sleep -Seconds 15 }
            }
          }

          # Chocolatey's community feed is a single point of failure and has
          # already 504'd a release here. Fall back to NSIS's own zip, which
          # needs no installer and no admin: makensis runs from the extracted
          # folder. Pinned by digest in .github/nsis.lock when that file exists,
          # following the same rule as the update verifier -- makensis compiles
          # the artifact users run, so what it is matters.
          if (-not $makensis) {
            $lock = ".github/nsis.lock"
            $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10.zip"
            $sha256 = ""
            if (Test-Path $lock) {
              foreach ($line in Get-Content $lock) {
                if ($line -match '^\s*([a-z0-9]+)\s*=\s*(\S+)\s*$') {
                  if ($Matches[1] -eq "url")    { $url = $Matches[2] }
                  if ($Matches[1] -eq "sha256") { $sha256 = $Matches[2] }
                }
              }
            }

            # SourceForge answers some requests with an HTML interstitial that
            # Invoke-WebRequest saves happily. Without this check the build
            # would "download NSIS", then fail deep in Expand-Archive - or
            # worse, pin the digest of a web page.
            function Test-IsZip($path) {
              if (-not (Test-Path $path)) { return $false }
              try {
                $fs = [System.IO.File]::OpenRead($path)
                try {
                  $sig = New-Object byte[] 2
                  $null = $fs.Read($sig, 0, 2)
                  return ($sig[0] -eq 0x50 -and $sig[1] -eq 0x4B)  # "PK"
                } finally { $fs.Dispose() }
              } catch {
                return $false  # unreadable or partial download is not a zip
              }
            }

            $zip = "nsis-dist.zip"
            foreach ($attempt in 1..3) {
              try {
                Write-Host "Downloading NSIS ($attempt of 3): $url"
                Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRedirection 10
                if (Test-IsZip $zip) { break }
                Write-Host "  response was not a zip (interstitial or error page); discarding."
                Remove-Item $zip -Force -ErrorAction SilentlyContinue
              } catch {
                Write-Host "  failed: $($_.Exception.Message)"
              }
              if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
            }

            if (Test-IsZip $zip) {
              $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
              if ($sha256) {
                if ($actual -ne $sha256.ToLower()) {
                  throw "NSIS zip digest mismatch`nexpected $sha256`ngot      $actual"
                }
                Write-Host "NSIS digest matches the pin in $lock."
              } else {
                $msg = ("NSIS was fetched UNPINNED (no $lock). SHA-256 ``$actual``. " +
                        "Add that digest to $lock to pin the tool that builds the installer.")
                Write-Warning $msg
                "### NSIS: unpinned`n`n$msg" >> $env:GITHUB_STEP_SUMMARY
              }
              Expand-Archive -Path $zip -DestinationPath "nsis-dist" -Force
              $makensis = (Get-ChildItem "nsis-dist" -Recurse -Filter "makensis.exe" |
                           Select-Object -First 1).FullName
            }
          }

          if (-not $makensis) {
            throw ("makensis could not be obtained. Searched PATH, both " +
                   "Program Files\NSIS locations and the Chocolatey bin, then " +
                   "tried choco (2x) and the NSIS zip (3x). Both sources may be " +
                   "down; re-run this job.")
          }
          & $makensis /VERSION
          "NSIS_EXE=$makensis" >> $env:GITHUB_ENV
          # choco leaves a non-zero exit code behind even when a later attempt
          # succeeded, and pwsh steps fail on the trailing $LASTEXITCODE.
          exit 0

      # Wraps the self-updating onedir tree from the Build step. The portable
      # zip is NOT this build -- it is cut from the no-update variant, for the
      # reason given at the Package step -- so the two are no longer the same
      # binary and this must keep pointing at dist/git-assistant.
      #
      # SRC_DIR/EXE_NAME are passed because this workflow names the build
      # git-assistant, while the local spec uses GitAssistant; the script
      # defaults to the latter.
      #
      # The .nsi path must be ABSOLUTE. Given a relative one, NSIS resolves
      # ${__FILEDIR__} to <cwd>\installer\installer -- the script's own
      # directory appended twice -- and the LICENSE and icon lookups fail.
      # Four installers from two bundles. The axes are independent: whether the
      # self-updater is in the bundle (which bundle) and where it installs
      # (a define on the same .nsi).
      #
      #   -user     %LOCALAPPDATA%\Programs, no UAC prompt
      #   -machine  Program Files, requires elevation
      #
      # Both halves are named explicitly. Leaving either implicit is how
      # "noupdate" came to mean "and also per-machine" by coincidence rather
      # than by name.
      - name: Build the installers
        id: inst
        run: |
          $version = "${{ steps.v.outputs.version }}"
          $root = $PWD.Path
          $variants = @(
            @{ key = "user";           dir = "dist\git-assistant";           exe = "git-assistant.exe"; machine = $false },
            @{ key = "machine";        dir = "dist\git-assistant";           exe = "git-assistant.exe"; machine = $true  },
            @{ key = "noupdate-user";  dir = "dist\GitAssistant-noupdate";   exe = "GitAssistant.exe";  machine = $false },
            @{ key = "noupdate-machine"; dir = "dist\GitAssistant-noupdate"; exe = "GitAssistant.exe";  machine = $true  }
          )

          foreach ($v in $variants) {
            $name = "git-assistant-$version-$($v.key)-windows-x64-setup.exe"
            $defines = @(
              "/DVERSION=$version",
              "/DSRC_DIR=$root\$($v.dir)",
              "/DEXE_NAME=$($v.exe)",
              "/DOUT_FILE=$root\$name"
            )
            if ($v.machine) { $defines += "/DPERMACHINE" }

            & $env:NSIS_EXE @defines "$root\installer\git-assistant.nsi"
            if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE for $($v.key)" }
            if (-not (Test-Path $name)) { throw "installer was not produced: $name" }

            # Underscores in the output key: `steps.inst.outputs.noupdate-user`
            # is parsed as a subtraction by the Actions expression language, so
            # a hyphen here yields an empty string at the point of use rather
            # than an error anywhere near this line.
            $out = $v.key -replace '-', '_'
            $sha = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
            "${out}_name=$name" >> $env:GITHUB_OUTPUT
            "${out}_sha256=$sha" >> $env:GITHUB_OUTPUT
            Write-Host "$sha  $name"
          }

      # Emits an in-toto Statement v1 carrying a SLSA Provenance v1 predicate,
      # wrapped in a DSSE envelope. Must run before the release is published so
      # the attestation exists by the time anything can download the asset.
      # Every asset is attested: a signed provenance covering some of them would
      # leave whichever download a user actually picked unvouched.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ${{ steps.pkg.outputs.name }}
            ${{ steps.inst.outputs.user_name }}
            ${{ steps.inst.outputs.machine_name }}
            ${{ steps.inst.outputs.noupdate_user_name }}
            ${{ steps.inst.outputs.noupdate_machine_name }}

      # gh is preinstalled on the runner. Using it rather than a release action
      # keeps one less third-party dependency in the path that produces the
      # artifact everyone downstream trusts.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Literal here-string: backticks are escapes in a "@ ... "@ one, and
          # the values are substituted by Actions before PowerShell parses this.
          $notes = @'
          Automated build.

          | Download | Installs to | Admin | Self-update | SHA-256 |
          | --- | --- | --- | --- | --- |
          | `${{ steps.inst.outputs.user_name }}` | `%LOCALAPPDATA%` | no | yes | `${{ steps.inst.outputs.user_sha256 }}` |
          | `${{ steps.inst.outputs.machine_name }}` | `Program Files` | yes | yes* | `${{ steps.inst.outputs.machine_sha256 }}` |
          | `${{ steps.inst.outputs.noupdate_user_name }}` | `%LOCALAPPDATA%` | no | no | `${{ steps.inst.outputs.noupdate_user_sha256 }}` |
          | `${{ steps.inst.outputs.noupdate_machine_name }}` | `Program Files` | yes | no | `${{ steps.inst.outputs.noupdate_machine_sha256 }}` |
          | `${{ steps.pkg.outputs.name }}` (portable zip) | anywhere | no | no | `${{ steps.pkg.outputs.sha256 }}` |

          **Which download?**

          - `-user` installs for you alone and never prompts for admin.
          - `-machine` installs to `Program Files` for everyone, and asks for admin once
            at install time.
          - `-noupdate` builds contain no self-updater at all — not a disabled one, the
            code is absent — so they cannot download or run anything. Upgrade by
            installing a newer version over the old one.
          - The **portable zip** is the no-update build: unzip anywhere, run
            `GitAssistant.exe`, replace the folder to upgrade.

          \* A `-machine` install shows a UAC prompt for **each** update, and follows a
          separate update channel so that it is offered a `-machine` installer rather
          than a per-user one. If that channel is not published, it finds no updates.

          Nothing here starts Git Assistant automatically at sign-in, and no installer
          launches the application when it finishes.
          '@
          gh release create "${{ github.ref_name }}" `
            "${{ steps.inst.outputs.user_name }}" `
            "${{ steps.inst.outputs.machine_name }}" `
            "${{ steps.inst.outputs.noupdate_user_name }}" `
            "${{ steps.inst.outputs.noupdate_machine_name }}" `
            "${{ steps.pkg.outputs.name }}" `
            --title "${{ github.ref_name }}" `
            --notes $notes
