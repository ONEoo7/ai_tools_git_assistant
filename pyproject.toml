[project]
name = "git-assistant"
# Derived from `src/git_assistant/__init__.py`, not declared here. A packaged
# build carries no distribution metadata, so that literal is what the running
# application reports and what the updater compares against; declaring the
# number twice let them drift.
dynamic = ["version"]
description = "System-tray Git assistant powered by a local LLM served by LM Studio"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Stefan Ghitescu" }]
dependencies = [
    "PyQt6>=6.7",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "tiktoken>=0.7",
]

[project.scripts]
git-assistant = "git_assistant.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.0",
]
# Note: self-update needs `dist-client`, which is deliberately NOT declared
# here. It is not published to an index yet, so declaring it — with or without
# a path source — makes `uv sync` fail for anyone without the distribution
# platform checked out beside this repository, including CI.
#
# It is installed explicitly instead, from a wheel that carries the compiled
# TUF verifier inside it:
#
#     uv pip install dist_client-<version>-py3-none-<platform>.whl
#
# Without it the application has no updater and says so; `UpdateConfig.enabled`
# checks for it. There is no path that falls back to fetching updates without
# verifying them. Move this to a real dependency once dist-client is published.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/git_assistant/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/git_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
