[project]
name = "git-assistant"
# Derived from `src/git_assistant/__init__.py`, not declared here. A packaged
# build carries no distribution metadata, so that literal is what the running
# application reports and what the updater compares against; declaring the
# number twice let them drift.
dynamic = ["version"]
description = "System-tray Git assistant powered by a local LLM served by LM Studio"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Stefan Ghitescu" }]
dependencies = [
    "PyQt6>=6.7",
    "anthropic>=0.120.2",
    "httpx>=0.27",
    # Code-review rule tables are spreadsheets: read on import, written on
    # export. Pure Python, and the only way to accept the file a team already
    # keeps its standards in.
    "langfuse>=4.14",
    "openpyxl>=3.1",
    "platformdirs>=4.2",
    "tiktoken>=0.7",
]

[project.scripts]
git-assistant = "git_assistant.app:main"
# The MCP server, for a source checkout. A packaged build ships it as its own
# executable instead; see git-assistant.spec.
git-assistant-mcp = "git_assistant.mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # `pytest -n auto` runs the suite in about a third of the time. Almost
    # every test builds a real repository and shells out to git, so the wall
    # clock is process start-up rather than anything this code does, and that
    # divides cleanly across cores. Not in `addopts`: a whole-suite run wants
    # every core, and a single test being debugged does not want to spawn two
    # dozen workers to run it.
    "pytest-xdist>=3.6",
    # A Qt test that opens a modal dialog nobody answers waits for it forever,
    # and a suite that never finishes says nothing about which test did it.
    # With this, it fails in a minute with the stack it was blocked in.
    "pytest-timeout>=2.3",
    # `pytest --testmon` runs only the tests whose code changed since the last
    # run, from a coverage map kept in .testmondata. Every test pays for the git
    # processes it starts whether or not anything it covers was touched, so
    # after an edit to one panel this is the difference between the suite and
    # that panel's tests.
    "pytest-testmon>=2.2",
]
build = [
    "pyinstaller>=6.0",
]
# Note: updating has no dependency to declare. It shells out to winget, which
# is part of Windows, and this used to be where `dist-client` — a wheel
# carrying a compiled TUF verifier, injected in CI because it is on no index —
# had to be explained. See git_assistant.updating.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/git_assistant/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/git_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# A backstop, not the guard: unanswered dialogs are caught in conftest, where
# the failure names the test and takes a second. This is for the rest -- a git
# command waiting on a prompt, a worker that never finishes. The slowest tests
# build nested submodules and take twenty seconds on their own; where every git
# process is scanned as it starts and twenty workers start them at once, they
# have taken nearly sixty. A timeout here ends the whole worker, and every
# result it had not yet reported with it, so the line sits well clear of that.
timeout = 180
timeout_method = "thread"
