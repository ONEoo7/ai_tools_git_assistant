[project]
name = "git-assistant"
version = "0.1.0"
description = "System-tray Git assistant powered by a local LLM served by LM Studio"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Stefan Ghitescu" }]
dependencies = [
    "PyQt6>=6.7",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "tiktoken>=0.7",
]

[project.scripts]
git-assistant = "git_assistant.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
